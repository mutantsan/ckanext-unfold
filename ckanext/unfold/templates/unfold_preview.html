<div class="unfold-preview">
    <div class="ckanext-jstree-search">
        <div class="jstree-search--input">
            <label class="d-none" for="jstree-search">{{ _('Search') }}</label>
            <input id="jstree-search" class="form-control" type="text" name="jstree-search"
                placeholder="{{ _('Search') }}" aria-label="{{ _('Search') }}" />
            <button class="jstree-search-clear text-muted" type="button" id="jstree-search-clear"
                title="{{ _('Clear search') }}" aria-label="{{ _('Clear search') }}" style="display: none">
                <i class="fa fa-close"></i>
            </button>
        </div>

        <button class="btn btn-sm" type="button" id="jstree-search-run" title="{{ _('Search') }}" aria-label="{{ _('Search') }}"><i
                class="fa fa-search"></i>
        </button>

        <button class="btn btn-sm" type="button" id="jstree-expand-all" title="{{ _('Expand all folders') }}" aria-label="{{ _('Expand all folders') }}">
            <i class="fa fa-folder-open"></i>
        </button>
        <button class="btn btn-sm" type="button" id="jstree-collapse-all" title="{{ _('Collapse all folders') }}" aria-label="{{ _('Collapse all folders') }}">
            <i class="fa fa-folder"></i>
        </button>

        <div class="unfold-load-state btn btn-sm">
            <img src="{{ h.url_for_static('/spinner.gif') }}" width="20" alt="{{ _('Loading') }}">
        </div>

        <span class="unfold-tree-meta text-muted align-self-center" aria-live="polite"></span>
    </div>

    <div class="pseudo-table-header">
        <div class="unf-cell unf-cell-name">
            {{ _("Name") }}
        </div>
        <div class="unf-cell unf-cell-size">
            {{ _("Size") }}
        </div>
        <div class="unf-cell unf-cell-modified-at">
            {{ _("Date Modified") }}
        </div>
    </div>

    <div id="archive-search-results" class="unfold-search-results" style="display: none" aria-live="polite"></div>

    {# Both blocks must stay outside #archive-tree: jstree replaces the
       container's content when it initialises. #}
    <div id="archive-tree--loader" class="ms-4">
        {{ _("Loading ...") }}
    </div>
    <div id="archive-tree-error" class="fw-normal mb-3" role="alert" style="display: none">
        <img src="{{ h.url_for_static('/error.gif') }}" width="30" alt="">
        <span class="unfold-error-message"></span>
        <button class="btn btn-sm" type="button" id="archive-tree-retry" style="display: none">{{ _("Retry") }}</button>
    </div>

    <div id="archive-tree" data-module="unfold-init-jstree"
        data-module-resource-id="{{ resource.id }}"
        data-module-resource-view-id="{{ resource_view.id }}"
        data-module-page-size="{{ page_size }}"
        data-module-show-context-menu="{{ (show_context_menu_default if resource_view.show_context_menu is undefined else resource_view.show_context_menu) | tojson }}"></div>
</div>

{% asset 'unfold/unfold-js' %}
{% asset 'unfold/unfold-css' %}
